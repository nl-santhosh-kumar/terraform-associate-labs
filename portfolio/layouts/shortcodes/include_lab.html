{{ $file := .Get "file" }}
{{ if (fileExists (printf "content/labs/%s" $file)) }}
    <div class="lab-content">
        {{ readFile (printf "content/labs/%s" $file) | markdownify }}
    </div>
{{ else }}
    <p style="color: red;">
        Error: Hugo cannot find the file at: <strong>content/labs/{{ $file }}</strong>
    </p>
{{ end }}
