{{ $file := .Get "file" }}
{{ $path := printf "content/labs/%s" $file }}

{{ if (fileExists $path) }}
    <article class="lab-container">
        {{ readFile $path | markdownify }}
    </article>
{{ else }}
    <div class="ui-alert-error">
        <strong>Missing Lab File:</strong> <code>{{ $path }}</code>
    </div>
{{ end }}
