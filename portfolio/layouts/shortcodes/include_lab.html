{{ $file := .Get "file" }}
{{ $path := printf "labs/%s" $file }}

{{ if (fileExists (printf "content/%s" $path)) }}
    <div class="lab-content">
        {{ readFile (printf "content/%s" $path) | markdownify }}
    </div>
{{ else }}
    <p style="color: red;">
        Error: Cannot find file at <strong>content/{{ $path }}</strong>
    </p>
{{ end }}
