{{- define "main" -}}
<div class="post-single">
  <h1 class="post-title">{{ .Title }}</h1>

  {{- $questions := index site.Data.question_master -}} {{- if $questions -}}
  <div
    id="quiz-engine"
    class="quiz-box"
    data-questions="{{ $questions | jsonify }}"
    data-answers-url="{{ "answers_master.json" | absURL }}"
  >
    <div id="quiz-ui">
      <div class="progress-container"><div id="progress-fill"></div></div>
      <div id="q-header">
        <span id="q-progress-text">Initializing...</span>
        <span id="q-score">Score: 0</span>
      </div>
      <div id="q-body"><p>Loading questions...</p></div>
      <div id="q-feedback"></div>
      <button id="next-btn" style="display: none">Next Question</button>
    </div>
  </div>
  {{- else -}}
  <div class="quiz-box" style="border-color: #e74c3c">
    <p style="color: #e74c3c; font-weight: bold">
      ⚠️ Data Error: Hugo cannot find quiz questions.
    </p>
  </div>
  {{- end -}}
</div>

<script defer src="{{ "js/quiz.js" | relURL }}"></script>

<style>
  /* ... Keep your existing CSS here ... */
  .quiz-box {
    background: var(--tertiary);
    padding: 30px;
    border-radius: 12px;
    border: 1px solid var(--border);
    max-width: 700px;
    margin: 20px auto;
  }
  .progress-container {
    width: 100%;
    background: var(--border);
    height: 10px;
    border-radius: 5px;
    margin-bottom: 20px;
    overflow: hidden;
  }
  #progress-fill {
    width: 0%;
    height: 100%;
    background: #844fba;
    transition: width 0.4s;
  }
  #q-header {
    display: flex;
    justify-content: space-between;
    margin-bottom: 20px;
    font-weight: bold;
  }
  .question-text {
    font-size: 1.25em;
    margin-bottom: 25px;
  }
  .options-grid {
    display: grid;
    gap: 12px;
  }
  .opt-btn {
    text-align: left;
    padding: 15px;
    background: var(--theme);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
  }
  .opt-btn:hover:not([disabled]) {
    border-color: #844fba;
    color: #844fba;
  }
  .opt-btn.correct {
    background: #2ecc71 !important;
    color: white !important;
  }
  .opt-btn.incorrect {
    background: #e74c3c !important;
    color: white !important;
  }
  .explanation-box {
    padding: 15px;
    border-radius: 8px;
    margin-top: 20px;
    background: var(--theme);
    border-left: 5px solid transparent;
  }
  .border-correct {
    border-left-color: #2ecc71;
  }
  .border-incorrect {
    border-left-color: #e74c3c;
  }
  #next-btn {
    margin-top: 20px;
    width: 100%;
    padding: 15px;
    background: #844fba;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  .results-screen {
    text-align: center;
  }
  .final-score {
    font-size: 3em;
    color: #844fba;
  }
  .btn-primary {
    padding: 12px 25px;
    background: #844fba;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
</style>
{{- end -}}
