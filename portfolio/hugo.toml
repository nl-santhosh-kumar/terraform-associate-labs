baseURL = 'https://nl-santhosh-kumar.github.io/terraform-associate-labs/'
languageCode = 'en-us'
title = 'Santhosh | Terraform Labs'
theme = 'PaperMod'
paginate = 5  # Shows 5 challenges per page

[params]
    env = 'production'
    title = "Terraform Associate Labs"
    description = "Documentation and insights from my HashiCorp certification journey."
    author = "Santhosh Kumar"
    
    # PaperMod specific UI
    defaultTheme = "dark" # Fits the "DevOps" aesthetic well
    ShowCodeCopyButtons = true
    mainSections = ["challenges", "posts"]
    showScrollToTop = true
    ShowSearchButton = true # Adds a magnifying glass to the menu

    [params.homeInfoParams]
        Title = "Terraform Lab Notes \U0001F4BB"
        Content = "Hands-on labs for the Terraform Associate Certification. Covering Providers, State, Modules, and AWS integration."
    [params.profileMode]
        enabled = false
        title = "Hi there! I'm Santhosh 👋"
        subtitle = "Automating the Cloud, One Challenge at a Time"
        Content = """
            Welcome! This site documents my path toward the **Terraform Associate (004)** certification. 
I am exploring the latest infrastructure-as-code standards, from local state management to **HCP Terraform** workflows. Each challenge below is a hands-on lab designed to master the 004 objectives.
"""
    
    [[params.socialIcons]]
        name = "github"
        url = "https://github.com/nl-santhosh-kumar/terraform-associate-labs"
    
    [[params.socialIcons]]
        name = "linkedin"
        url = "https://www.linkedin.com/in/santhosh-kumar-r-04711024/"

[menu]
    [[menu.main]]
        identifier = "search"
        name = "Search"
        url = "/search/"
        weight = 10
    
    [[menu.main]]
        identifier = "about"
        name = "About"
        url = "/about/"
        weight = 20

[security]
  [security.funcs]
    getenv = ['^HUGO_']
  [security.http]
    methods = ['(?i)GET|POST']
  [security.path]
    allow = ['..'] # This allows Hugo to read your lab folders

[taxonomies]
    category = "categories"
    series = "series" # This allows you to group labs as "Terraform Associate Series"
    tag = "tags"

[outputs]
    home = ["HTML", "RSS", "JSON"] # This generates the search index