baseurl = "https://nl-santhosh-kumar.github.io/terraform-associate-labs/"
languageCode = 'en-us'
title = 'Santhosh | Terraform Labs'
theme = 'PaperMod'
paginate = 5  # Shows 5 challenges per page

[params]
    env = 'production'
    description = "Documentation and insights from my HashiCorp certification journey."
    author = "Santhosh Kumar"
    
    # PaperMod specific UI
    defaultTheme = "dark" # Fits the "DevOps" aesthetic well
    ShowCodeCopyButtons = true
    mainSections = ["challenges", "posts"]
    
    showScrollToTop = true
    ShowSearchButton = true # Adds a magnifying glass to the menu
    ShowPostNavLinks = true
    
    # This adds a nice header ABOVE your list of posts
    [params.homeInfoParams]
        Title = "Mastering Terraform 004 🚀"
        Content = """
Welcome to your primary resource for mastering **Infrastructure as Code**. 

Whether you are preparing for the **HashiCorp Certified: Terraform Associate (004)** exam or looking to scale production-grade infrastructure, you’ll find deep dives into provider logic, state management, and modular design here. 

**Stop clicking, start coding.** Browse the latest guides below or search for a specific resource.
    """


    [params.profileMode]
        enabled = false
        title = "Terraform Associate Labs"
        subtitle = "Master Infrastructure as Code with Hands-on Labs"
       
        # We will add buttons that look like Google's
        [[params.profileMode.buttons]]
        name = "Search Tutorials"
        url = "#" # This stays on the page to focus the search bar
        
        [[params.profileMode.buttons]]
        name = "I'm Feeling Lucky"
        url = "/posts/" # Or link to your first specific tutorial

[frontmatter]
    date = ["date", "publishDate", "lastmod"]

[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = true
    style = "dracula" # You can change this to "dracula", "nord", or "solarized-dark"
    noClasses = false
  [markup.goldmark]
      [markup.goldmark.renderer]
        unsafe = true  # This allows HTML inside your Markdown files   

[menu]
    [[menu.main]]
        identifier = "search"
        name = "Search"
        url = "/search/"
        weight = 10
    [[menu.main]]
        identifier = "about"
        name = "About"
        url = "/about/"
        weight = 20
    [[menus.main]]
        name = "Terraform Quiz"
        url = "/quiz/"
        weight = 5

[taxonomies]
    category = "categories"
    series = "series" # This allows you to group labs as "Terraform Associate Series"
    tag = "tags"

[outputs]
    home = ["HTML", "RSS", "JSON"] # This generates the search index

[params.search]
    enable = true
    type = "fuse" # Ensure the search engine type is defined
    showRemoteIcon = false
    # This ensures the search engine knows exactly where the index is
    searchIndex = "index.json"

[security]
  # Keep whatever was already here (like for Goldmark or exec)
  [security.funcs]
    # Add this line to the existing funcs block
    readFile = ['.*']

  [security.http]
    methods = ['(?i)GET']
    urls = ['.*']
  [security.exec]
    allow = ['^(dart-)?sass(-embedded)?$', '^go$', '^npx$', '^postcss$']
    osEnv = ['(?i)^((PATH|PATHEXT|APPDATA|TMP|TEMP|TERM)|(ASSETFS_HOSTNAME))$']
  [security.module]
    allowMountDirectives = true

  